name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Pinned, not ubuntu-latest: the latest image moves under us and the
    # setup-python resolution breaks on versions we still support (3.9 was
    # dropped for Ubuntu 26.04).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make check

  tripwire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if [ -f src/tripwire/package.json ]; then
            cd src/tripwire && npm ci && npm test
          else
            echo "tripwire package lands in P2"
          fi
