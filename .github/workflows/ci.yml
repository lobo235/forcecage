name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Pinned, not ubuntu-latest: the latest image moves under us and the
    # setup-python resolution breaks on versions we still support (3.9 was
    # dropped for Ubuntu 26.04).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make check

  tripwire:
    # The tripwire core is pure (no pi import) and ships source as TypeScript:
    # `node --test *.test.ts` needs a Node that runs .ts natively (unflagged type
    # stripping, Node >= 23.6). 24 is a current LTS line that does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd src/tripwire && npm ci && npm test
